services:
  db:
    image: postgres:17-alpine
    container_name: pprbot-postgres
    environment:
      POSTGRES_DB: ppr_db
      POSTGRES_USER: ppr_user
      POSTGRES_PASSWORD: ppr_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ppr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppr_user -d ppr_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppr_postgres_data:
